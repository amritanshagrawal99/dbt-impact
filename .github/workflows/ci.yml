name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  e2e:
    # Rebuild the example manifests with real dbt and run the action against them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install dbt-duckdb
      - run: python examples/build_manifests.py
      - id: impact
        uses: ./
        with:
          base-manifest: examples/manifests/base.json
          current-manifest: examples/manifests/pr.json
          fail-on-breaking: "false"
          comment: "false"
      - name: Example must report breaking changes
        run: test "${{ steps.impact.outputs.has-breaking }}" = "true"
